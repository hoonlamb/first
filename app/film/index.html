<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>댕큐 출시 영상 컴포지션</title>
<style>
@import url("/node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css");
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#15201A;color:#F4F1EA;font-family:"Pretendard Variable",sans-serif;word-break:keep-all}
.stage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 508px;gap:96px;padding:90px 180px 90px 140px;align-items:center}
.copy{position:relative;height:100%}
.cap{position:absolute;left:0;right:0;top:50%;transform:translateY(-40%);opacity:0;transition:opacity .5s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.cap.on{opacity:1;transform:translateY(-50%)}
.k{font-size:26px;font-weight:800;color:#9FD3B2;margin-bottom:24px;letter-spacing:.02em}
.t{font-size:96px;font-weight:880;letter-spacing:-.055em;line-height:1.02}
.t em{font-style:normal;color:#FF6A2B}
.s{margin-top:28px;font-size:30px;color:#A9B3AD;font-weight:600;max-width:20em}
.phone{width:508px;height:900px;border-radius:56px;background:#000;padding:14px;box-shadow:0 40px 120px rgba(0,0,0,.5);position:relative;transition:opacity .5s}
.phone iframe{width:100%;height:100%;border:0;border-radius:44px;background:#F4F1EA}
.lanes{position:absolute;left:140px;right:880px;bottom:56px;height:24px}
.lanes i{position:absolute;left:0;height:6px;border-radius:3px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.l1{top:0;background:#F4F1EA;width:0}.l2{top:16px;background:#FF6A2B;width:0}
.end{position:absolute;inset:0;pointer-events:none;background:#15201A;display:grid;place-content:center;justify-items:center;gap:36px;opacity:0;transition:opacity .7s;text-align:center}
.end.on{opacity:1}
.end .t{font-size:112px}
.logo{display:flex;align-items:center;gap:22px;font-size:64px;font-weight:850;letter-spacing:-.05em}
.fine{font-size:22px;color:#A9B3AD;font-weight:600}
</style></head><body>
<div class="stage">
  <div class="copy">
    <div class="cap" id="c1"><p class="k">산책길의 3초</p><p class="t">“귀엽다!”<br>다가오는 손.</p><p class="s">어떤 개에게는 가장 무서운 순간이에요.</p></div>
    <div class="cap" id="c2"><p class="k">개마다 다른 거리</p><p class="t">큰 걸음 <em>10번</em>,<br>뽀리의 거리.</p><p class="s">부탁 한 줄과 거리를 산책 카드 한 장에.</p></div>
    <div class="cap" id="c3"><p class="k">보여주기</p><p class="t">말 대신<br>화면 한 장.</p><p class="s">누가 다가오면, 카드를 크게.</p></div>
    <div class="cap" id="c4"><p class="k">나란히 첫 산책</p><p class="t">멀리서,<br>같은 방향으로.</p><p class="s">첫 만남은 인사 없이. 둘 다 편할 때만 한 걸음 더.</p></div>
    <div class="cap" id="c5"><p class="k">사이 기록</p><p class="t"><em>10m</em> → <em>6m</em></p><p class="s">첫날은 여기까지. 다음엔 이어서 시작해요.</p></div>
  </div>
  <div class="phone" id="phone"><iframe id="app" src="/#/" title="댕큐"></iframe></div>
</div>
<div class="lanes" aria-hidden="true"><i class="l1" id="l1"></i><i class="l2" id="l2"></i></div>
<div class="end" id="end">
  <div class="logo"><svg width="96" height="72" viewBox="0 0 48 36"><line x1="3" y1="9" x2="33" y2="9" stroke="#F4F1EA" stroke-width="6" stroke-linecap="round"/><line x1="13" y1="27" x2="33" y2="27" stroke="#FF6A2B" stroke-width="6" stroke-linecap="round"/><circle cx="42" cy="9" r="5" fill="#F4F1EA"/><circle cx="42" cy="27" r="5" fill="#FF6A2B"/></svg>댕큐</div>
  <p class="t">가까워지는 데는<br>순서가 있어요.</p>
  <p class="fine">체험 모드 화면 실제 녹화 · 포트폴리오 프로젝트</p>
</div>
<script>
window.cap = (n) => { document.querySelectorAll('.cap').forEach((c,i)=>c.classList.toggle('on', i+1===n)); const p=[0,20,45,60,85,100][n]||0; document.getElementById('l1').style.width=p+'%'; document.getElementById('l2').style.width=Math.max(0,p-6)+'%'; };
window.end = () => { document.getElementById('end').classList.add('on') };
</script>
</body></html>
